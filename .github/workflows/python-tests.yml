name: Test Python package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-type:
    name: Lint and Type Checks - Python 3.10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without doc

      - name: Run ruff
        run: poetry run task lint_check

      - name: Run mypy
        run: poetry run task type_check

  validation-cross-platform:
    name: Validation tests - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without doc

      - name: Run validation/unit contract tests
        run: poetry run pytest -q tests/test_args.py tests/test_magic_params.py tests/test_toolchains.py tests/test_executor.py tests/test_help_snapshot.py tests/test_diagnostics_contract.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tex_engine: pdflatex
            python_version: "3.10"
            default_toolchain: pdftex_pdftocairo
            include_xetex: false
            include_luatex: false
            experimental: false
          - tex_engine: pdflatex
            python_version: "3.11"
            default_toolchain: pdftex_pdftocairo
            include_xetex: false
            include_luatex: false
            experimental: false
          - tex_engine: pdflatex
            python_version: "3.12"
            default_toolchain: pdftex_pdftocairo
            include_xetex: false
            include_luatex: false
            experimental: false
          - tex_engine: pdflatex
            python_version: "3.13"
            default_toolchain: pdftex_pdftocairo
            include_xetex: false
            include_luatex: false
            experimental: false
          - tex_engine: xelatex
            python_version: "3.11"
            default_toolchain: xelatex_pdftocairo
            include_xetex: true
            include_luatex: false
            experimental: false
          - tex_engine: lualatex
            python_version: "3.11"
            default_toolchain: pdftex_pdftocairo
            include_xetex: false
            include_luatex: true
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install LaTeX and Poppler
        run: |
          sudo apt update
          sudo apt install -y texlive-latex-extra poppler-utils
          if [ "${{ matrix.include_xetex }}" = "true" ]; then
            sudo apt install -y texlive-xetex
          fi
          if [ "${{ matrix.include_luatex }}" = "true" ]; then
            sudo apt install -y texlive-luatex
          fi

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --without doc

      - name: Run tests
        env:
          JUPYTER_TIKZ_DEFAULT_TOOLCHAIN: ${{ matrix.default_toolchain }}
          JUPYTER_TIKZ_RUN_RENDER_TESTS: "1"
        run: |
          poetry run task test

      - name: Upload coverage to Codecov
        if: ${{ !matrix.experimental }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
